name: Deploy WordPress Theme

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: SamKirkland/web-deploy@1
        with:
          target-server: ${{ secrets.SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: /wp-content/themes/pipeline_test/
          local-dir: ./
